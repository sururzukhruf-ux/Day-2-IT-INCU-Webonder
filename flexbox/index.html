<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h2>MyWebsite</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    <section class="hero">
        <h1>Welcome to MyWebsite</h1>
        <p>Belajar Membuat Website</p>
        <button class="btn-transition">
            Mulai Belajar
        </button>
    </section>
    <section class="features">
        <div class="feature-card">
            <h3>Transform</h3>
            <p>Arahkan kursor ke kartu ini</p>
        </div>
        <div class="animation-card">
            <h3>KeyFrame</h3>
            <p>Kartu dengan animasi otomatis</p>
        </div>
    </section>
    <section class="loading-section">
        <h2>Loading Animation</h2>
        <p>Contoh penerapanya</p>
        <div class="loader"></div>
    </section>
</body>
</html>
